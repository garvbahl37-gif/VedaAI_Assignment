services:
  - type: web
    name: vedaai-api
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm install && npm run build -w @vedaai/shared && npm run build -w @vedaai/api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: vedaai-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CORS_ORIGIN
        sync: false

  - type: redis
    name: vedaai-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
